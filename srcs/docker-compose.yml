networks:
  wp-network:

services:
  mariadb:
    build: ./mariadb
    restart: always
    networks: wp-network
    volumes:
      - wordpressDB:/home/cjeannin/data/wordpressDB

  wordpress:
    depends_on:
      - mariadb
    build: ./wordpress
    restart: always
    networks: wp-network
    volumes:
      - wordpressfiles:/home/cjeannin/data/wordpressfiles

  nginx:
    build: ./nginx
    restart: always
    networks: wp-network
    depends_on:
      - wordpress
    ports:
      - "443:443"

# make a docker network for the communication between containers
#

# named volume with data stored in /home/cjeannin/data
volumes:
  wordpressDB:
  wordpressfiles:


